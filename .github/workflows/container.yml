name: Publish Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/friedcheese2006/prospector

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r backend/requirements.txt

      - name: Verify Python lockfile
        run: make requirements-check

      - name: Run release checks
        run: make test

  security:
    name: Scan container
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for security scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: prospector:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify hardened runtime
        run: |
          set -eu
          test "$(docker image inspect prospector:scan --format '{{.Config.User}}')" = "10001:10001"

          volume="prospector-security-${GITHUB_RUN_ID}"
          container="prospector-security-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "${container}" >/dev/null 2>&1 || true
            docker volume rm "${volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "${volume}"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user 10001:10001 \
            --volume "${volume}:/app/data" \
            prospector:scan \
            python -c "import os, sqlite3; assert (os.getuid(), os.getgid()) == (10001, 10001); connection = sqlite3.connect('/app/data/runtime-check.db'); connection.execute('CREATE TABLE runtime_check (id INTEGER)'); connection.commit(); connection.close()"

          docker run --detach \
            --name "${container}" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user 10001:10001 \
            --volume "${volume}:/app/data" \
            --publish 127.0.0.1:8000:8000 \
            prospector:scan
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --output /dev/null \
            http://127.0.0.1:8000/auth/config
          docker restart "${container}"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --output /dev/null \
            http://127.0.0.1:8000/auth/config
          docker exec "${container}" python -c "import sqlite3; connection = sqlite3.connect('/app/data/runtime-check.db'); assert connection.execute(\"SELECT name FROM sqlite_master WHERE type='table' AND name='runtime_check'\").fetchone(); connection.close()"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prospector:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL

  publish:
    name: Publish container
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
      packages: write # Publish the image to GHCR.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
