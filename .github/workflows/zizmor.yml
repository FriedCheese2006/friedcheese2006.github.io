name: GitHub Actions Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read # Resolve referenced Actions metadata for online audits.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows
          persona: pedantic
          version: "1.30.0"
