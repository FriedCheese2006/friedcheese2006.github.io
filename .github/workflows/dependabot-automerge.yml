name: Dependabot security auto-merge

on: # zizmor: ignore[dangerous-triggers] -- Uses base-branch code only; never checks out or executes the PR.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read # Read commit verification metadata.
  pull-requests: read # Inspect the PR and list its changed files.

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Queue verified security update
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Check scope
        id: scope
        if: >-
          (steps.metadata.outputs.dependency-group == 'npm-security' ||
           steps.metadata.outputs.dependency-group == 'pip-security') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.metadata.outputs.maintainer-changes == 'false' &&
          steps.metadata.outputs.dependency-names != '' &&
          !contains(steps.metadata.outputs.dependency-names, ',')
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$GROUP" in
            npm-security)
              lock=package-lock.json
              manifest=package.json
              ;;
            pip-security)
              lock=backend/requirements.txt
              manifest=backend/requirements.in
              ;;
            *) exit 1 ;;
          esac
          files=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files")
          if jq -e --arg lock "$lock" --arg manifest "$manifest" '
            add | any(.filename == $lock) and
              all(.status == "modified" and (.filename == $lock or .filename == $manifest))
          ' <<<"$files" >/dev/null; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Queue auto-merge
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::DEPENDABOT_AUTOMERGE_TOKEN is missing; merge this PR manually."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --match-head-commit "$HEAD_SHA"
