services:
  app:
    image: ${PROSPECTOR_IMAGE:-ghcr.io/friedcheese2006/prospector:latest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/prospector.db
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    volumes:
      - prospector_data:/app/data

volumes:
  prospector_data:
